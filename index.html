<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of War Drafting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Control Panel -->
    <div id="panel">
        <h2>Country Color</h2>
        <input type="color" id="picker" value="#ff0000">
        <br>
        <button id="eraser">Eraser</button>
        <button id="toggle-teams-btn">Name Teams</button>
    </div>

    <!-- SVG Map Container (Add your map paths here with the class 'region' and a unique country code class) -->
    <svg viewBox="0 0 1000 800">
        <!-- Example paths: make sure they use class="region [country-code]" -->
        <path class="region country1" d="M100,100 L200,100 L200,200 L100,200 Z" />
        <path class="region country1" d="M200,100 L300,100 L300,200 L200,200 Z" />
        <path class="region country2" d="M350,100 L450,100 L450,200 L350,200 Z" />
    </svg>

    <!-- Team Text Block (Top) -->
    <div class="text-block block-top">
        <div class="block-header">
            <span>Team 1</span>
            <input type="color" class="block-color" value="#ffffff">
        </div>
        <textarea class="block-content" placeholder="Name..."></textarea>
        <div class="resize-handle"></div>
    </div>

    <!-- Team Text Block (Bottom) -->
    <div class="text-block block-bottom">
        <div class="block-header">
            <span>Team 2</span>
            <input type="color" class="block-color" value="#ffffff">
        </div>
        <textarea class="block-content" placeholder="Name..."></textarea>
        <div class="resize-handle"></div>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
